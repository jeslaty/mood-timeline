<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b5bd6"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mood Timeline"><title>Mood Timeline</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<main id="app">
<section id="lockScreen" class="screen center"><div class="lock-card"><div class="logo">◐</div><h1>Mood Timeline</h1>
<p id="pinHint">建立你的 4 位數 PIN</p><div id="dots" class="dots"><i></i><i></i><i></i><i></i></div>
<div class="keypad" id="keypad"></div><button id="clearPin" class="text-btn">清除</button>
<p class="privacy-note">資料只儲存在這台裝置。請記住 PIN。</p></div></section>

<section id="mainScreen" class="screen hidden"><header><div><small id="todayLabel"></small><h1>Mood Timeline</h1></div>
<button id="lockBtn" class="icon-btn">🔒</button></header>
<nav class="tabs"><button data-tab="mood" class="active">記錄</button><button data-tab="sleep">睡眠</button>
<button data-tab="timeline">時間軸</button><button data-tab="trends">趨勢</button><button data-tab="settings">設定</button></nav>

<section id="mood" class="panel"><div class="card"><h2>現在的狀態如何？</h2>
<div class="scale-label"><span>-10 極度憂鬱</span><span>+10 極度亢奮</span></div>
<input id="moodRange" type="range" min="-10" max="10" value="0"><div id="moodValue" class="score">0</div>
<h3>目前的感受 <small>（可選 1～3 個）</small></h3><div id="feelings" class="chips"></div>
<h3>發生了什麼嗎？ <small>（選填）</small></h3><div id="events" class="chips"></div>
<textarea id="moodNote" maxlength="200" placeholder="簡單記一下…"></textarea><button id="saveMood" class="primary">儲存這次紀錄</button></div></section>

<section id="sleep" class="panel hidden"><div class="card"><h2>🌙 昨晚睡眠</h2>
<div class="time-grid"><label>上床<input id="bedTime" type="time"></label><label>大約入睡<input id="sleepTime" type="time"></label><label>起床<input id="wakeTime" type="time"></label></div>
<div id="sleepDuration" class="sleep-total">請輸入入睡與起床時間</div><h3>睡眠品質</h3><div id="quality" class="chips single"></div>
<h3>半夜醒來</h3><div id="wakeCount" class="chips single"></div><textarea id="sleepNote" maxlength="200" placeholder="備註（選填）"></textarea>
<button id="saveSleep" class="primary">儲存睡眠紀錄</button></div></section>

<section id="timeline" class="panel hidden"><div class="card"><div class="timeline-head"><div><small>今日紀錄</small><h2 id="timelineDate"></h2></div></div>
<canvas id="dayChart" width="560" height="220"></canvas><div id="summary" class="summary"></div><div id="timelineList" class="timeline"></div></div></section>

<section id="trends" class="panel hidden"><div class="card"><div class="timeline-head"><div><small>長期觀察</small><h2>情緒趨勢</h2></div>
<select id="trendRange"><option value="7">7 天</option><option value="30" selected>30 天</option><option value="90">3 個月</option></select></div>
<p class="hint">每一天顯示最低～最高範圍，圓點為當日紀錄中位數；不把一天的波動壓成單一平均值。</p>
<canvas id="trendChart" width="560" height="280"></canvas><div id="trendStats" class="summary"></div>
<h3>睡眠與情緒</h3><div id="sleepCompare" class="observation"></div></div></section>

<section id="settings" class="panel hidden"><div class="card"><h2>設定與資料</h2>
<label class="setting-row">自動鎖定<select id="lockDelay"><option value="0">立即</option><option value="1">1 分鐘</option><option value="5">5 分鐘</option></select></label>
<button id="changePin" class="secondary wide">變更 4 位數 PIN</button><hr>
<h3>備份</h3><p class="hint">備份檔包含你的情緒與睡眠紀錄，請保存在私人位置。</p>
<div class="button-row"><button id="exportBtn" class="secondary">匯出備份</button><label class="secondary file-btn">匯入備份<input id="importFile" type="file" accept="application/json"></label></div>
<hr><h3>測試完成後</h3><button id="clearData" class="danger wide">清除所有情緒與睡眠資料</button>
<p class="hint">這不會刪除 PIN。清除後無法復原，除非你已有備份。</p></div></section>
</section></main><script src="app.js"></script></body></html>
